<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a8a">
  <title>AB Parc Auto · AB RENOV 35</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css?v=13">
  <script src="app.js?v=15" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">AB</span><span>Parc Auto <small>AB RENOV 35</small></span></div>
    <button id="refreshButton" class="top-action" type="button" title="Actualiser les données">Actualiser</button>
    <button id="logoutButton" class="top-action" type="button" hidden>Quitter</button>
  </header>
  <nav class="tabs" aria-label="Navigation principale">
    <button type="button" class="tab active" data-view="dashboard">À suivre</button>
    <button type="button" class="tab" data-view="vehicles">Véhicules</button>
    <button type="button" class="tab" data-view="expenses">Dépenses</button>
    <button type="button" class="tab" data-view="settings">Paramètres</button>
  </nav>
  <main id="app" class="shell" aria-live="polite">
    <div class="loading"><span class="spinner"></span> Chargement du parc…</div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="formDialog" aria-labelledby="dialogTitle">
    <form id="editorForm" novalidate>
      <div class="dialog-header"><h2 id="dialogTitle"></h2><button type="button" class="icon-close" id="closeDialog" aria-label="Fermer">×</button></div>
      <div id="formFields" class="form-grid"></div>
      <div class="dialog-actions"><button type="button" class="button secondary" id="cancelDialog">Annuler</button><button type="submit" class="button primary" id="submitDialog">Enregistrer</button></div>
    </form>
  </dialog>
</body>
</html>
