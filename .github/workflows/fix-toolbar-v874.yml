name: Fix AB PARC AUTO toolbar v8.74

on:
  push:
    paths:
      - '.github/workflows/fix-toolbar-v874.yml'

permissions:
  contents: write

jobs:
  fix-toolbar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Forcer le fond du sélecteur véhicule
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('AB PARC AUTO v8.73 - sélecteur véhicule corrigé','AB PARC AUTO v8.74 - fond sélecteur véhicule forcé',1)
          s=s.replace("const APP_VERSION = 'v8.73'", "const APP_VERSION = 'v8.74'",1)
          s=s.replace('id="appVersionBadge">v8.73<','id="appVersionBadge">v8.74<',1)
          css=r'''

/* ===== V8.74 : FORCER LE SELECT VEHICULE SANS FOND BLANC ===== */
.planning-auto-header .vehicle-picker-wrap{
  background:#1e3a8a !important;
  background-color:#1e3a8a !important;
}
.planning-auto-header #vehicleQuickSelect,
.planning-auto-header select#vehicleQuickSelect,
.planning-auto-header .vehicle-picker{
  -webkit-appearance:none !important;
  appearance:none !important;
  background:#1e3a8a !important;
  background-color:#1e3a8a !important;
  color:#fff !important;
  -webkit-text-fill-color:#fff !important;
  border:1px solid rgba(255,255,255,.42) !important;
  box-shadow:inset 0 0 0 1000px #1e3a8a !important;
  opacity:1 !important;
}
.planning-auto-header #vehicleQuickSelect:hover,
.planning-auto-header #vehicleQuickSelect:focus{
  background:#24448f !important;
  background-color:#24448f !important;
  box-shadow:inset 0 0 0 1000px #24448f !important;
  color:#fff !important;
  -webkit-text-fill-color:#fff !important;
}
.planning-auto-header #vehicleQuickSelect option{
  background:#fff !important;
  color:#1f2937 !important;
  -webkit-text-fill-color:#1f2937 !important;
}
'''
          s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: force fond bleu du sélecteur véhicule v8.74"
          git push

# trigger 2
