name: Fix AB PARC AUTO toolbar v8.75

on:
  push:
    paths:
      - '.github/workflows/fix-toolbar-v875.yml'

permissions:
  contents: write

jobs:
  fix-toolbar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply AB STOCK toolbar alignment
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('AB PARC AUTO v8.74 - fond sélecteur véhicule forcé', 'AB PARC AUTO v8.75 - bandeau hauteur AB STOCK', 1)
          s = s.replace("const APP_VERSION = 'v8.74'", "const APP_VERSION = 'v8.75'", 1)
          s = s.replace('id="appVersionBadge">v8.74<', 'id="appVersionBadge">v8.75<', 1)
          css = "\n/* V8.75 AB STOCK */\n.planning-auto-header{height:50px!important;min-height:50px!important;padding:8px 12px!important;background:#24448f!important;border-bottom:0!important;box-sizing:border-box!important;overflow-y:hidden!important;}\n.planning-auto-bar{height:34px!important;min-height:34px!important;background:#24448f!important;gap:8px!important;}\n.planning-auto-header .app-brand{height:30px!important;min-height:30px!important;padding-right:10px!important;gap:6px!important;}\n.planning-auto-header .app-brand-icon{font-size:16px!important;}\n.planning-auto-header .app-brand-title{font-size:14px!important;line-height:1!important;}\n.planning-auto-header .app-nav,.planning-auto-header .app-nav-buttons{height:34px!important;min-height:34px!important;background:#24448f!important;gap:7px!important;}\n.planning-auto-header .btn-toolbar,.planning-auto-header button.btn-toolbar{height:34px!important;min-height:34px!important;padding:0 12px!important;font-size:11px!important;border-radius:5px!important;}\n.planning-auto-header #vehicleQuickSelect,.planning-auto-header .vehicle-picker{height:34px!important;min-height:34px!important;font-size:11px!important;border-radius:5px!important;background:#24448f!important;background-color:#24448f!important;box-shadow:none!important;}\n.planning-auto-header #vehicleQuickSelect:hover,.planning-auto-header #vehicleQuickSelect:focus{background:#2b4d9b!important;background-color:#2b4d9b!important;box-shadow:none!important;}\n.planning-auto-header .planning-version,.planning-auto-header #appVersionBadge{font-size:9px!important;}\n.alert-banner:has(.alert-items:empty),.alert-banner-revision:has(.alert-items-revision:empty){display:none!important;height:0!important;min-height:0!important;margin:0!important;padding:0!important;border:0!important;}\n"
          s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: bandeau AB STOCK et affichage alertes v8.75"
          git push
