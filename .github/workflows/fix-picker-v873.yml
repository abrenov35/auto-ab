name: Fix vehicle picker v8.73

on:
  push:
    paths:
      - '.github/workflows/fix-picker-v873.yml'

permissions:
  contents: write

jobs:
  fix-picker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Corriger le champ véhicule du bandeau
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('AB PARC AUTO v8.72 - hauteur exacte AB Planning','AB PARC AUTO v8.73 - sélecteur véhicule corrigé',1)
          s=s.replace("const APP_VERSION = 'v8.72';","const APP_VERSION = 'v8.73';")
          s=s.replace('>v8.72</span>','>v8.73</span>')
          css=r'''

          /* ===== V8.73 : SELECT VEHICULE VISUEL AB PLANNING ===== */
          .planning-auto-header .vehicle-picker,
          .planning-auto-header select.vehicle-picker,
          #vehicleQuickSelect {
            -webkit-appearance: none !important;
            appearance: none !important;
            background-color: transparent !important;
            background-image: linear-gradient(45deg, transparent 50%, #fff 50%), linear-gradient(135deg, #fff 50%, transparent 50%) !important;
            background-position: calc(100% - 14px) 50%, calc(100% - 10px) 50% !important;
            background-size: 5px 5px, 5px 5px !important;
            background-repeat: no-repeat !important;
            color: #fff !important;
            border: 1px solid rgba(255,255,255,.42) !important;
            box-shadow: none !important;
          }
          .planning-auto-header #vehicleQuickSelect:focus {
            background-color: rgba(255,255,255,.08) !important;
            outline: none !important;
          }
          .planning-auto-header #vehicleQuickSelect option {
            background: #fff !important;
            color: #1f2937 !important;
          }
          '''
          s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: champ choisir véhicule non blanc v8.73"
          git push
