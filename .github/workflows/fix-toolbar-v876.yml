name: Fix toolbar v8.76

on:
  push:
    paths:
      - '.github/workflows/fix-toolbar-v876.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply toolbar fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('AB PARC AUTO v8.75 - bandeau hauteur AB STOCK', 'AB PARC AUTO v8.76 - bandeau exact AB STOCK', 1)
          s = s.replace("const APP_VERSION = 'v8.75'", "const APP_VERSION = 'v8.76'", 1)
          s = s.replace('id="appVersionBadge">v8.75<', 'id="appVersionBadge">v8.76<', 1)
          s = s.replace('(choisir un véhicule)', 'Choisir un véhicule')
          css = '''

/* ===== V8.76 : BANDEAU EXACT AB STOCK ===== */
.planning-auto-header {
  height: 51px !important;
  min-height: 51px !important;
  max-height: 51px !important;
  padding: 8px 0 !important;
  margin: 0 !important;
  background: #24448f !important;
  border: 0 !important;
  box-shadow: none !important;
  overflow: hidden !important;
  box-sizing: border-box !important;
}
.planning-auto-bar {
  height: 35px !important;
  min-height: 35px !important;
  max-height: 35px !important;
  width: 100% !important;
  padding: 0 12px !important;
  margin: 0 !important;
  display: flex !important;
  align-items: center !important;
  gap: 8px !important;
  background: #24448f !important;
  box-sizing: border-box !important;
}
.planning-auto-header .app-brand {
  height: 31px !important;
  min-height: 31px !important;
  padding: 0 10px 0 0 !important;
  margin: 0 !important;
  gap: 6px !important;
  border-right: 1px solid rgba(255,255,255,.35) !important;
}
.planning-auto-header .app-brand-icon { font-size: 16px !important; line-height: 1 !important; }
.planning-auto-header .app-brand-title { font-size: 14px !important; line-height: 1 !important; font-weight: 800 !important; }
.planning-auto-header .app-nav,
.planning-auto-header .app-nav-buttons {
  height: 35px !important;
  min-height: 35px !important;
  max-height: 35px !important;
  padding: 0 !important;
  margin: 0 !important;
  gap: 7px !important;
  background: transparent !important;
  align-items: center !important;
}
.planning-auto-header .btn-toolbar,
.planning-auto-header button.btn-toolbar {
  height: 35px !important;
  min-height: 35px !important;
  max-height: 35px !important;
  padding: 0 13px !important;
  margin: 0 !important;
  border: 1px solid rgba(255,255,255,.42) !important;
  border-radius: 5px !important;
  background: transparent !important;
  color: #fff !important;
  font-size: 11px !important;
  font-weight: 700 !important;
  line-height: 1 !important;
  box-shadow: none !important;
  transform: none !important;
  box-sizing: border-box !important;
}
.planning-auto-header .btn-toolbar:hover,
.planning-auto-header .btn-toolbar:focus {
  background: rgba(255,255,255,.08) !important;
  box-shadow: none !important;
}
.planning-auto-header .btn-toolbar.active,
.planning-auto-header button.btn-toolbar.active,
.planning-auto-header #btnVehicleManagement.active {
  background: transparent !important;
  border: 1px solid rgba(255,255,255,.42) !important;
  border-bottom: 3px solid #f59e0b !important;
  box-shadow: none !important;
  transform: none !important;
}
.planning-auto-header .vehicle-picker-wrap {
  height: 35px !important;
  min-height: 35px !important;
  margin: 0 !important;
  padding: 0 !important;
  background: transparent !important;
}
.planning-auto-header #vehicleQuickSelect,
.planning-auto-header select#vehicleQuickSelect,
.planning-auto-header .vehicle-picker {
  height: 35px !important;
  min-height: 35px !important;
  max-height: 35px !important;
  width: 210px !important;
  min-width: 210px !important;
  max-width: 210px !important;
  padding: 0 30px 0 12px !important;
  margin: 0 !important;
  border: 1px solid rgba(255,255,255,.42) !important;
  border-radius: 5px !important;
  background-color: transparent !important;
  color: #fff !important;
  -webkit-text-fill-color: #fff !important;
  font-size: 11px !important;
  font-weight: 700 !important;
  line-height: 1 !important;
  box-shadow: none !important;
  box-sizing: border-box !important;
}
.planning-auto-header #vehicleQuickSelect:hover,
.planning-auto-header #vehicleQuickSelect:focus {
  background-color: rgba(255,255,255,.08) !important;
  outline: none !important;
  box-shadow: none !important;
}
.planning-auto-header #vehicleQuickSelect option {
  background: #fff !important;
  color: #1f2937 !important;
  -webkit-text-fill-color: #1f2937 !important;
}
.planning-auto-header .planning-version,
.planning-auto-header #appVersionBadge {
  height: 35px !important;
  display: inline-flex !important;
  align-items: center !important;
  padding: 0 4px !important;
  margin: 0 !important;
  font-size: 9px !important;
  line-height: 1 !important;
  background: transparent !important;
}
.alert-banner:empty,
.alert-banner-revision:empty,
.alert-banner:has(.alert-items:empty),
.alert-banner-revision:has(.alert-items-revision:empty) {
  display: none !important;
}
'''
          s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: toolbar exact AB STOCK and active state v8.76"
          git push
